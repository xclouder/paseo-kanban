<div id="goal-redesign" class="viz-carousel" aria-label="目标面板交互方案" data-previous-label="上一方案" data-next-label="下一方案">
  <section data-variant="列表与详情" aria-label="列表与详情方案"><div class="g-app" data-layout="split"></div></section>
  <section data-variant="概览与抽屉" aria-label="概览与抽屉方案" hidden><div class="g-app" data-layout="overview"></div></section>
</div>
<style>
#goal-redesign .g-app{--g-bg:light-dark(#fafafa,#151517);--g-panel:light-dark(#fff,#1c1c1f);--g-text:light-dark(#242428,#ededf0);--g-muted:light-dark(#73737d,#a3a3ad);--g-line:light-dark(#e5e5ea,#313136);--g-hover:light-dark(#f2f2f5,#28282e);--g-accent:light-dark(#6550c7,#ac9bf5);--g-soft:light-dark(#eeeafa,#302b43);--g-danger:light-dark(#b5323d,#f1959e);color:var(--g-text);background:var(--g-bg);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;border:1px solid var(--g-line);border-radius:12px;position:relative;min-height:660px;overflow-wrap:anywhere}
#goal-redesign .g-app *{box-sizing:border-box}
#goal-redesign .g-app button,#goal-redesign .g-app input,#goal-redesign .g-app textarea{font:inherit;color:inherit}
#goal-redesign .g-app button{cursor:inherit;border:1px solid var(--g-line);background:var(--g-panel);border-radius:7px;padding:7px 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:normal}
#goal-redesign .g-app button:hover{background:var(--g-hover)}
#goal-redesign .g-app button:disabled{opacity:.45}
#goal-redesign .g-app .g-primary{background:var(--g-text);color:var(--g-panel);border-color:var(--g-text)}
#goal-redesign .g-app .g-plain{border-color:transparent;background:transparent}
#goal-redesign .g-app .g-icon{padding:7px;min-width:34px}
#goal-redesign .g-app svg{width:16px;height:16px;flex-shrink:0}
#goal-redesign .g-app .g-muted{color:var(--g-muted)}
#goal-redesign .g-app .g-small{font-size:12px}
#goal-redesign .g-app h2{font-size:22px;font-weight:600;line-height:1.4;margin:0}
#goal-redesign .g-app h3{font-size:16px;font-weight:600;margin:0}
#goal-redesign .g-app p{margin:0}
#goal-redesign .g-app .g-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#goal-redesign .g-app .g-between{justify-content:space-between}
#goal-redesign .g-app .g-top{padding:16px 20px;border-bottom:1px solid var(--g-line);background:var(--g-panel);border-radius:12px 12px 0 0}
#goal-redesign .g-app .g-brand{font-weight:600;letter-spacing:.04em}
#goal-redesign .g-app .g-nav{padding:8px 20px;border-bottom:1px solid var(--g-line);background:var(--g-panel)}
#goal-redesign .g-app .g-active{background:var(--g-soft);color:var(--g-accent);border-color:transparent}
#goal-redesign .g-app .g-work{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:555px}
#goal-redesign .g-app .g-list{border-right:1px solid var(--g-line);padding:18px 12px}
#goal-redesign .g-app .g-list input{margin:16px 0 12px}
#goal-redesign .g-app input,#goal-redesign .g-app textarea{display:block;width:100%;background:var(--g-panel);border:1px solid var(--g-line);border-radius:7px;padding:9px 11px}
#goal-redesign .g-app textarea{min-height:100px;resize:vertical}
#goal-redesign .g-app .g-filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
#goal-redesign .g-app .g-filters button{font-size:12px;padding:5px 8px}
#goal-redesign .g-app .g-goal{display:block;text-align:left;width:100%;border:0;border-radius:7px;padding:13px 11px;margin:3px 0;background:transparent}
#goal-redesign .g-app .g-goal[aria-pressed=true]{background:var(--g-soft)}
#goal-redesign .g-app .g-goal strong{display:block;font-weight:500;margin-bottom:6px}
#goal-redesign .g-app .g-goal .g-small{display:flex;justify-content:space-between;gap:8px;color:var(--g-muted)}
#goal-redesign .g-app .g-detail{padding:26px;min-width:0;background:var(--g-panel)}
#goal-redesign .g-app .g-eyebrow{display:flex;align-items:center;gap:7px;color:var(--g-muted);font-size:12px;margin-bottom:12px}
#goal-redesign .g-app .g-description{color:var(--g-muted);margin:14px 0 24px;max-width:640px}
#goal-redesign .g-app .g-progress{height:5px;border-radius:4px;background:var(--g-hover);margin:10px 0 25px;overflow:hidden}
#goal-redesign .g-app .g-progress span{display:block;height:100%;background:var(--g-accent);border-radius:4px}
#goal-redesign .g-app .g-taskhead{margin-bottom:12px}
#goal-redesign .g-app .g-task{width:100%;border:0;border-top:1px solid var(--g-line);border-radius:0;padding:14px 0;background:transparent;justify-content:flex-start;text-align:left}
#goal-redesign .g-app .g-tasktitle{flex:1;min-width:90px}
#goal-redesign .g-app .g-taskstate{font-size:12px;color:var(--g-muted);text-align:right}
#goal-redesign .g-app .g-note{font-size:12px;color:var(--g-muted);margin-top:20px}
#goal-redesign .g-app .g-menuwrap{position:relative}
#goal-redesign .g-app .g-menu{position:absolute;right:0;top:40px;width:162px;z-index:3;background:var(--g-panel);border:1px solid var(--g-line);border-radius:9px;padding:5px;box-shadow:0 8px 24px light-dark(#00000012,#00000040)}
#goal-redesign .g-app .g-menu button{border:0;width:100%;justify-content:flex-start}
#goal-redesign .g-app .g-danger{color:var(--g-danger)}
#goal-redesign .g-app .g-overview{padding:24px}
#goal-redesign .g-app .g-overviewtools{margin:20px 0}
#goal-redesign .g-app .g-overviewtools input{max-width:260px}
#goal-redesign .g-app .g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#goal-redesign .g-app .g-tile{padding:20px;display:block;text-align:left;min-height:170px}
#goal-redesign .g-app .g-tile h3{margin:10px 0}
#goal-redesign .g-app .g-tile .g-progress{margin:15px 0 10px}
#goal-redesign .g-app .g-shade{position:absolute;inset:0;background:light-dark(#25252b44,#00000088);z-index:6;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:20px}
#goal-redesign .g-app .g-dialog{width:440px;max-width:100%;background:var(--g-panel);padding:24px;border:1px solid var(--g-line);border-radius:12px;box-shadow:0 16px 50px light-dark(#00000022,#00000055)}
#goal-redesign .g-app .g-dialog label{display:block;margin:18px 0}
#goal-redesign .g-app .g-dialog label span{display:block;margin-bottom:7px}
#goal-redesign .g-app .g-actions{justify-content:flex-end;margin-top:22px}
#goal-redesign .g-app .g-drawer-shade{align-items:stretch;justify-content:flex-end;padding:0}
#goal-redesign .g-app .g-drawer{width:580px;max-width:92%;border-radius:0 12px 12px 0;border-left:1px solid var(--g-line);background:var(--g-panel);padding:24px}
#goal-redesign .g-app .g-empty{padding:30px 10px;color:var(--g-muted);text-align:center}
#goal-redesign .g-app .g-close{margin-left:auto}
#goal-redesign .g-app [hidden]{display:none!important}
@media(max-width:650px){#goal-redesign .g-app .g-work{grid-template-columns:1fr}#goal-redesign .g-app .g-list{border-right:0;border-bottom:1px solid var(--g-line)}#goal-redesign .g-app .g-goal{padding:9px 11px}#goal-redesign .g-app .g-detail{padding:20px}#goal-redesign .g-app .g-grid{grid-template-columns:1fr}#goal-redesign .g-app .g-drawer{max-width:100%;width:100%}#goal-redesign .g-app{min-height:980px}}
</style>
<script>
(()=>{
  const root=document.getElementById('goal-redesign');
  const initial=[
    {id:'release',title:'交付目标管理功能',description:'让任务围绕目标组织，完成目标的维护、任务关联和验收。',done:false,tasks:[{title:'完成目标数据与接口',state:'已完成'},{title:'接入任务目标关联',state:'已完成'},{title:'重新设计目标面板',state:'执行中'},{title:'验收完整交互流程',state:'待办'}]},
    {id:'performance',title:'改善看板使用体验',description:'减少重复操作，优化任务查找和执行效率。',done:false,tasks:[{title:'优化任务搜索',state:'已完成'},{title:'改进移动端任务入口',state:'待审核'},{title:'整理常用会话入口',state:'待办'}]},
    {id:'inbox',title:'上线 Inbox 想法收集',description:'从想法收集到任务执行，形成完整流程。',done:true,tasks:[{title:'快速记录想法',state:'已完成'},{title:'将想法整理为任务',state:'已完成'}]}
  ];
  const saved=window.openai?.widgetState?.privateContent;
  const states=[];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  function persist(){window.openai?.setWidgetState?.({modelContent:{design:'目标面板：列表与详情 / 概览与抽屉'},privateContent:{states:states.map(x=>({goals:x.goals,selected:x.selected,filter:x.filter}))}})?.catch(()=>{});}
  root.querySelectorAll('.g-app').forEach((app,index)=>{
    const stored=saved?.states?.[index];
    const s={goals:stored?.goals||structuredClone(initial),selected:stored?.selected||'release',filter:stored?.filter||'active',query:'',menu:false,dialog:null,drawer:false,message:''};states.push(s);
    function stats(g){return [g.tasks.filter(t=>t.state==='已完成').length,g.tasks.length];}
    function progress(g){const [a,b]=stats(g);return `<div class="g-progress" aria-label="任务完成进度 ${a}/${b}"><span style="width:${b?a/b*100:0}%"></span></div>`;}
    function filtered(){return s.goals.filter(g=>(s.filter==='all'||(s.filter==='done'?g.done:!g.done))&&`${g.title} ${g.description}`.includes(s.query));}
    function filterBar(){return `<div class="g-filters">${[['active','进行中'],['done','已完成'],['all','全部']].map(([k,v])=>`<button class="cursor-interaction ${s.filter===k?'g-active':''}" data-filter="${k}" aria-pressed="${s.filter===k}">${v} ${s.goals.filter(g=>k==='all'||g.done===(k==='done')).length}</button>`).join('')}</div>`;}
    function detail(g){if(!g)return '<div class="g-empty">选择一个目标，查看关联任务。</div>';const [a,b]=stats(g);return `
      <div class="g-row g-between"><div class="g-eyebrow">${icon(g.done?'circle-check':'target')}${g.done?'已完成':'进行中'}</div><div class="g-row">${s.drawer?'<button class="g-plain g-icon g-close cursor-interaction" data-action="close-drawer" aria-label="关闭目标详情">'+icon('x')+'</button>':''}</div></div>
      <div class="g-row g-between"><h2>${esc(g.title)}</h2><div class="g-row"><button class="cursor-interaction" data-action="complete">${icon(g.done?'rotate-ccw':'check')}${g.done?'重新打开':'标记完成'}</button><div class="g-menuwrap"><button class="g-plain g-icon cursor-interaction" data-action="menu" aria-label="更多目标操作" aria-expanded="${s.menu}">${icon('ellipsis')}</button>${s.menu?'<div class="g-menu"><button class="cursor-interaction" data-action="edit">'+icon('pencil')+'编辑目标</button><button class="g-danger cursor-interaction" data-action="delete">'+icon('trash-2')+'删除目标</button></div>':''}</div></div></div>
      <p class="g-description">${esc(g.description||'暂无目标说明')}</p>
      <div class="g-row g-between g-small g-muted"><span>任务完成进度</span><span>${a} / ${b} 已完成</span></div>${progress(g)}
      <div class="g-row g-between g-taskhead"><h3>关联任务 <span class="g-muted">${b}</span></h3><button class="g-plain cursor-interaction" data-action="add-task">${icon('plus')}添加任务</button></div>
      ${g.tasks.map((t,i)=>`<button class="g-task cursor-interaction" data-task="${i}">${icon(t.state==='已完成'?'circle-check':t.state==='执行中'?'circle-play':'circle-dashed')}<span class="g-tasktitle">${esc(t.title)}</span><span class="g-taskstate">${esc(t.state)}</span>${icon('chevron-right')}</button>`).join('')||'<div class="g-empty">还没有关联任务，添加任务开始推进。</div>'}
      <p class="g-note">任务进度供参考，目标由你手动确认完成。</p>`;}
    function render(){
      const g=s.goals.find(x=>x.id===s.selected);const list=filtered();
      app.innerHTML=`<header class="g-top g-row g-between"><div class="g-row"><span class="g-brand">Paseo Kanban</span><span class="g-muted g-small">所有项目</span></div><span class="g-muted g-small">设计预览</span></header><nav class="g-nav g-row"><button class="g-plain cursor-interaction" data-action="board">${icon('columns-3')}任务看板</button><button class="g-active cursor-interaction" data-action="goals">${icon('target')}目标</button><button class="g-plain cursor-interaction" data-action="inbox">${icon('inbox')}Inbox</button></nav>
      ${app.dataset.layout==='split'?`<div class="g-work"><aside class="g-list"><div class="g-row g-between"><h3>目标</h3><button class="g-plain cursor-interaction" data-action="new">${icon('plus')}新建</button></div><input aria-label="搜索目标" placeholder="搜索目标…" value="${esc(s.query)}" data-search>${filterBar()}<div data-goal-list>${list.map(x=>{const[a,b]=stats(x);return `<button class="g-goal cursor-interaction" data-goal="${x.id}" aria-pressed="${x.id===s.selected}"><strong>${esc(x.title)}</strong><span class="g-small"><span>${x.done?'已完成':'进行中'}</span><span>${a} / ${b} 项任务</span></span></button>`;}).join('')||'<div class="g-empty">没有符合条件的目标</div>'}</div></aside><main class="g-detail">${detail(g)}</main></div>`:
      `<main class="g-overview"><div class="g-row g-between"><h2>目标</h2><button class="g-primary cursor-interaction" data-action="new">${icon('plus')}新建目标</button></div><div class="g-overviewtools g-row g-between">${filterBar()}<input aria-label="搜索目标" placeholder="搜索目标…" value="${esc(s.query)}" data-search></div><div class="g-grid">${list.map(x=>{const[a,b]=stats(x);return `<button class="g-tile cursor-interaction" data-goal="${x.id}"><span class="g-small g-muted">${x.done?'已完成':'进行中'}</span><h3>${esc(x.title)}</h3><p class="g-small g-muted">${esc(x.description)}</p>${progress(x)}<span class="g-small g-muted">${a} / ${b} 项任务已完成</span></button>`;}).join('')}</div></main>${s.drawer?`<div class="g-shade g-drawer-shade"><section class="g-drawer" aria-label="目标详情">${detail(g)}</section></div>`:''}`}
      ${s.message?`<div class="g-row g-between" role="status" style="padding:12px 20px;border-top:1px solid var(--g-line)"><span class="g-small g-muted">${esc(s.message)}</span><button class="g-plain g-icon cursor-interaction" data-action="dismiss" aria-label="关闭提示">${icon('x')}</button></div>`:''}${dialogMarkup(g)}`;
      if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    }
    function dialogMarkup(g){if(!s.dialog)return '';const type=s.dialog;
      let body='';
      if(type==='new'||type==='edit')body=`<h3>${type==='new'?'新建目标':'编辑目标'}</h3><form data-form="goal"><label><span>目标名称</span><input name="title" aria-label="目标名称" placeholder="希望实现什么？" required maxlength="1000" value="${type==='edit'?esc(g?.title||''):''}"></label><label><span>目标说明 <span class="g-muted g-small">可选</span></span><textarea name="description" aria-label="目标说明" placeholder="补充背景与完成标准…">${type==='edit'?esc(g?.description||''):''}</textarea></label><div class="g-row g-actions"><button type="button" class="cursor-interaction" data-action="cancel">取消</button><button class="g-primary cursor-interaction" type="submit">${type==='new'?'创建目标':'保存修改'}</button></div></form>`;
      if(type==='delete')body=`<h3>删除“${esc(g?.title||'')}”？</h3><p class="g-description">关联任务会保留，删除后变为无目标。</p><div class="g-row g-actions"><button class="cursor-interaction" data-action="cancel">取消</button><button class="g-danger cursor-interaction" data-action="confirm-delete">删除目标</button></div>`;
      if(type==='add-task')body=`<h3>添加任务到目标</h3><p class="g-description">${esc(g?.title||'')}</p><button class="g-task cursor-interaction" data-action="new-task">${icon('plus')}新建任务并关联</button><button class="g-task cursor-interaction" data-action="pick-task">${icon('link')}关联已有任务</button><div class="g-row g-actions"><button class="cursor-interaction" data-action="cancel">取消</button></div>`;
      if(type==='pick-task')body=`<h3>关联已有任务</h3><p class="g-description">选择任务后立即关联，每个任务只属于一个目标。</p>${['补充边界场景测试','检查手机端布局'].map(t=>`<button class="g-task cursor-interaction" data-pick="${t}">${icon('circle-dashed')}<span class="g-tasktitle">${t}</span><span class="g-muted g-small">无目标</span></button>`).join('')}<div class="g-row g-actions"><button class="cursor-interaction" data-action="cancel">取消</button></div>`;
      if(type==='new-task')body=`<h3>新建任务</h3><p class="g-description">所属目标：${esc(g?.title||'')}</p><form data-form="task"><label><span>任务标题</span><input name="title" aria-label="任务标题" required placeholder="需要做什么？"></label><div class="g-row g-actions"><button type="button" class="cursor-interaction" data-action="cancel">取消</button><button type="submit" class="g-primary cursor-interaction">创建任务</button></div></form>`;
      if(type.startsWith('task:')){const t=g?.tasks[Number(type.split(':')[1])];body=`<h3>${esc(t?.title||'任务详情')}</h3><p class="g-description">${esc(t?.state||'')} · ${esc(g?.title||'')}</p><div class="g-row g-actions"><button class="cursor-interaction" data-action="cancel">返回目标</button></div>`;}
      return `<div class="g-shade"><section class="g-dialog" role="dialog" aria-modal="true" aria-label="${type==='new'?'新建目标':type==='edit'?'编辑目标':'目标操作'}">${body}</section></div>`;
    }
    app.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;s.query=e.target.value;const at=e.target.selectionStart;render();const el=app.querySelector('[data-search]');el.focus();el.setSelectionRange(at,at);});
    app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.type==='submit'&&b.closest('form'))return;const g=s.goals.find(x=>x.id===s.selected);
      if(b.dataset.filter){s.filter=b.dataset.filter;s.menu=false;}
      if(b.dataset.goal){s.selected=b.dataset.goal;s.drawer=app.dataset.layout==='overview';s.menu=false;}
      if(b.dataset.task!==undefined)s.dialog='task:'+b.dataset.task;
      if(b.dataset.pick){g?.tasks.push({title:b.dataset.pick,state:'待办'});s.dialog=null;s.message='已关联任务';}
      const action=b.dataset.action;
      if(['new','edit','delete','add-task','pick-task','new-task'].includes(action)){s.dialog=action;s.menu=false;}
      if(action==='cancel')s.dialog=null;
      if(action==='menu')s.menu=!s.menu;
      if(action==='complete'&&g){g.done=!g.done;s.message=g.done?'目标已标记完成，关联任务状态保持不变':'目标已重新打开';}
      if(action==='confirm-delete'&&g){s.goals=s.goals.filter(x=>x.id!==g.id);s.selected=s.goals[0]?.id;s.dialog=null;s.drawer=false;s.message='目标已删除，关联任务保留为无目标';}
      if(action==='close-drawer'){s.drawer=false;s.menu=false;}
      if(action==='dismiss')s.message='';
      if(action==='board'||action==='inbox')s.message='当前预览聚焦目标面板；正式界面将切换到'+(action==='board'?'任务看板':'Inbox');
      render();persist();
      if(s.dialog==='new'||s.dialog==='edit'||s.dialog==='new-task')app.querySelector('.g-dialog input')?.focus();
    });
    app.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const title=new FormData(form).get('title')?.trim();if(!title)return;const g=s.goals.find(x=>x.id===s.selected);
      if(form.dataset.form==='task'){g?.tasks.push({title,state:'待办'});s.message='任务已创建并关联目标';}
      else{const description=String(new FormData(form).get('description')||'').trim();if(s.dialog==='edit'&&g){g.title=title;g.description=description;}else{const id='goal-'+Date.now();s.goals.unshift({id,title,description,done:false,tasks:[]});s.selected=id;s.filter='active';s.query='';s.drawer=app.dataset.layout==='overview';}s.message=s.dialog==='edit'?'目标已更新':'目标已创建';}
      s.dialog=null;render();persist();
    });
    app.addEventListener('keydown',e=>{if(e.key==='Escape'){s.dialog=null;s.menu=false;s.drawer=false;render();}});
    render();
  });
})();
</script>
